name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - name: the lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - run: npm run build
      # Without the vector extension several tests return early instead of
      # failing, so a cell where it does not load must not pass.
      - name: the vector extension loads
        run: node -e "const D=require('better-sqlite3');const v=require('sqlite-vec');const d=new D(':memory:');v.load(d);console.log('sqlite-vec',d.prepare('select vec_version() as v').get().v)"
      - run: npm test
